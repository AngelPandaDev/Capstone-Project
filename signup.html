<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - InstaGrab | Order Food Online</title>
  <link rel="stylesheet" href="global.css">
  <link rel="stylesheet" href="signup.css">
</head>
<body>

  <!-- Header & Navigation -->
  <header>
    <div class="container">
      <nav class="navbar">
        <a href="index.html" class="logo">InstaGrab</a>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="contact.html">Contact</a></li>
          <li><a href="faq.html">FAQ</a></li>
        </ul>
        <div class="nav-buttons">
          <button id="theme-toggle" class="theme-toggle">🌓</button>
          <a href="login.html" class="btn btn-secondary">Login</a>
        </div>
      </nav>
    </div>
  </header>

  <!-- Sign Up Section -->
  <section class="signup-section">
    <div class="container">
      <div class="signup-card-wrapper">
        <div class="card signup-card">
          <div class="card-body">
            <h2 class="card-title">Create Account</h2>

            <form class="signup-form">
              <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="Your Name" required>
              </div>

              <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Your Email" required>
              </div>

              <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
              </div>

              <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required>
              </div>

              <div class="form-group terms">
                <label>
                  <input type="checkbox" name="terms" required>
                  I agree to the Terms of Service
                </label>
              </div>

              <button type="submit" class="btn btn-primary btn-block">Create Account</button>
            </form>

            <div class="signin-link">
              <p>Already have an account? <a href="login.html">Sign in</a></p>
            </div>

            <div class="social-login">
              <button class="btn social-btn">Google</button>
              <button class="btn social-btn">Apple</button>
            </div>
          </div>
        </div>

        <p class="signup-note">
          By creating an account, you agree to InstaGrab's <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.
        </p>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        <p>&copy; 2025 InstaGrab. All rights reserved.</p>
      </div>
    </div>
  </footer>
  <script src="theme.js"></script>
  <script>
    const signupForm = document.querySelector('.signup-form');
    const emailInput = document.getElementById('email');
    
    signupForm.addEventListener('submit', function(event) {
      event.preventDefault();
      const email = emailInput.value.trim();
      const requiredDomain = '@nst.rishihood.edu.in';
      
      if (!email.endsWith(requiredDomain)) {
        alert('Please use your @nst.rishihood.edu.in email address to sign up.');
      }
      else {
        window.location.href = 'restaurants.html';
      }
    });
  </script>
</body>
</html>
