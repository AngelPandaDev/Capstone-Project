<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - InstaGrab | Order Food Online</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <div class="container">
      <nav>
        <a href="index.html" class="logo">InstaGrab</a>

        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="contact.html">Contact</a></li>
          <li><a href="faq.html">FAQ</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <section style="padding:4rem 0; display:flex; min-height:70vh; align-items:center;">
    <div class="container">
      <div style="max-width:400px; margin:0 auto;">

        <div class="card" style="box-shadow:0 6px 18px rgba(0,0,0,0.08);">
          <div class="card-body" style="padding:2rem;">

            <h2 style="text-align:center; margin-bottom:2rem;">Login</h2>

            <form class="login-form">

              <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required>
              </div>

              <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
              </div>

              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
                <label style="display:flex; align-items:center; gap:0.4rem;">
                  <input type="checkbox" name="remember" style="width:auto; margin:0;">
                  Remember me
                </label>

                <a href="#" style="font-size:0.85rem;">Forgot password?</a>
              </div>

              <button type="submit" class="btn btn-primary" style="width:100%; padding:0.9rem; margin-bottom:1.5rem;">
                Sign In
              </button>

            </form>

            <div style="text-align:center; border-top:1px solid #e5e5e5; padding-top:1.5rem;">
              <p>Don't have an account? 
                <a href="signup.html" style="font-weight:600;">Sign up</a>
              </p>
            </div>

            <div style="display:flex; gap:1rem; margin-top:1.5rem;">
              <button style="flex:1; padding:0.9rem; border:1px solid #e0e0e0; border-radius:0.5rem; background:white; cursor:pointer;">
                Google
              </button>

              <button style="flex:1; padding:0.9rem; border:1px solid #e0e0e0; border-radius:0.5rem; background:white; cursor:pointer;">
                Apple
              </button>
            </div>

          </div>
        </div>

        <p style="text-align:center; margin-top:1.5rem; color:#888;">
          By continuing, you agree to InstaGrab's 
          <a href="#">Terms of Service</a> and 
          <a href="#">Privacy Policy</a>.
        </p>

      </div>
    </div>
  </section>

  <footer style="margin-top:3rem;">
    <div class="container">
      <div class="footer-bottom" style="border-top:1px solid rgba(0,0,0,0.1); padding-top:1.5rem;">
        <p>&copy; 2025 InstaGrab. All rights reserved.</p>
      </div>
    </div>
  </footer>

</body>
</html>
